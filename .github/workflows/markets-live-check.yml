name: Marknadsläget live-kontroll

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/markets-live.js"
      - ".github/workflows/markets-live-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Källornas svar och CORS-huvuden
        run: |
          for u in \
            "https://www.avanza.se/_api/market-guide/index/18981" \
            "https://www.avanza.se/_api/market-guide/index/155722" \
            "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=.GDAXI%7C@LCO.1&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json" \
            "https://query1.finance.yahoo.com/v8/finance/chart/%5EGDAXI?range=1d&interval=15m" \
            "https://query1.finance.yahoo.com/v8/finance/chart/BZ%3DF?range=1d&interval=15m" \
            "https://stooq.com/q/l/?s=%5Edax&f=sd2t2ohlcp&h&e=json" \
            "https://stooq.com/q/l/?s=cb.f&f=sd2t2ohlcp&h&e=json" \
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true" \
            "https://api.exchange.coinbase.com/products/ETH-USD/stats" \
            'https://data-api.binance.vision/api/v3/ticker/24hr?symbols=%5B%22BTCUSDT%22,%22ETHUSDT%22%5D' \
            "https://api.frankfurter.dev/v1/latest?from=EUR&to=SEK,USD"; do
            echo "=== $u"
            curl -s -m 15 -D - -o body.txt -H "Origin: https://nordicbrief.se" "$u" | grep -iE "^HTTP|access-control-allow-origin" || true
            head -c 300 body.txt; echo
          done
      - name: Vänta på GitHub Pages
        run: sleep 120
      - name: Ladda nordicbrief.se i Chromium
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > check.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            p.on('console', m => console.log('console:', m.type(), m.text()));
            p.on('requestfailed', r => console.log('failed:', r.url(), r.failure() && r.failure().errorText));
            await p.goto('https://nordicbrief.se/?t=' + Date.now(), { waitUntil: 'networkidle' });
            await p.waitForTimeout(10000);
            console.log(await p.$eval('.markets', e => e.innerText));
            const eth = await p.$eval('[data-live="eth"] .m-val', e => e.textContent);
            await b.close();
            if (eth.trim() === '—') { console.log('ETHEREUM SAKNAS'); process.exit(1); }
          })();
          EOF
          node check.js
