name: Marknadsläget live-kontroll

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/markets-live.js"
      - ".github/workflows/markets-live-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Källornas svar och CORS-huvuden
        run: |
          for u in \
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true" \
            "https://api.exchange.coinbase.com/products/ETH-USD/stats" \
            'https://data-api.binance.vision/api/v3/ticker/24hr?symbols=%5B%22BTCUSDT%22,%22ETHUSDT%22%5D' \
            "https://api.frankfurter.dev/v1/latest?from=EUR&to=SEK,USD"; do
            echo "=== $u"
            curl -s -m 15 -D - -o body.txt -H "Origin: https://nordicbrief.se" "$u" | grep -iE "^HTTP|access-control-allow-origin" || true
            head -c 300 body.txt; echo
          done
      - name: Vänta på GitHub Pages
        run: sleep 120
      - name: Ladda nordicbrief.se i Chromium
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > check.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            p.on('console', m => console.log('console:', m.type(), m.text()));
            p.on('requestfailed', r => console.log('failed:', r.url(), r.failure() && r.failure().errorText));
            await p.goto('https://nordicbrief.se/?t=' + Date.now(), { waitUntil: 'load', timeout: 60000 });
            await p.waitForTimeout(25000);
            console.log(await p.$eval('.markets', e => e.innerText));
            const tvText = async (page) => {
              for (const f of page.frames()) {
                if (f.url().includes('tradingview')) {
                  try { console.log('TRADINGVIEW:', (await f.evaluate(() => document.body.innerText)).replace(/\s+/g, ' ').slice(0, 300)); } catch (e) { console.log('TRADINGVIEW fel:', e.message); }
                }
              }
            };
            await tvText(p);
            await p.locator('.markets').screenshot({ path: 'markets.jpg', type: 'jpeg', quality: 60 });
            const eth = await p.$eval('[data-live="eth"] .m-val', e => e.textContent);
            // Vilka symboler visar kurs i TradingViews officiella widget på vår domän?
            const cands = ['FOREXCOM:UKXGBP', 'TVC:UKOIL'];
            const t = await b.newPage();
            await t.goto('https://nordicbrief.se/om/');
            await t.evaluate((cands) => {
              document.body.innerHTML = '';
              for (const s of cands) {
                const d = document.createElement('div');
                d.className = 'tradingview-widget-container';
                d.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
                const sc = document.createElement('script');
                sc.src = 'https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';
                sc.async = true;
                sc.text = JSON.stringify({ symbol: s, width: 350, isTransparent: false, colorTheme: 'light', locale: 'en' });
                d.appendChild(sc);
                document.body.appendChild(d);
              }
            }, cands);
            await t.waitForTimeout(25000);
            await tvText(t);
            await t.setViewportSize({ width: 400, height: 1100 });
            await t.screenshot({ path: 'cands.jpg', type: 'jpeg', quality: 45, fullPage: true });
            await b.close();
            if (eth.trim() === '—') { console.log('ETHEREUM SAKNAS'); process.exit(1); }
          })();
          EOF
          node check.js
      - name: Spara skärmbilder i grenen checks
        if: always()
        run: |
          mkdir out && cp *.jpg out/ 2>/dev/null || true
          cd out && git init -q -b checks && git add -A
          git -c user.name=livecheck -c user.email=livecheck@users.noreply.github.com commit -qm "Livekontroll $(date -u +%FT%TZ)" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" checks
